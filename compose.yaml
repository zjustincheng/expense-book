services:
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense_book}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_book}
      POSTGRES_DB: ${POSTGRES_DB:-expense_book}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-expense_book} -d ${POSTGRES_DB:-expense_book}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-/data/expense-book.sqlite}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/data/attachments}
      AUTH_MODE: ${AUTH_MODE:-local}
      APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      - ${DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://backend:4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-local}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
