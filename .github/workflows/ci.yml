name: Quality checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: expense_book
          POSTGRES_PASSWORD: expense_book
          POSTGRES_DB: expense_book_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense_book"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://expense_book:expense_book@localhost:5432/expense_book_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
  container-images:
    runs-on: ubuntu-latest
    needs: application
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t expense-book-frontend:ci .
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t expense-book-backend:ci .
