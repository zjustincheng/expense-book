services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-/data/expense-book.sqlite}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-/data/attachments}
      AUTH_MODE: ${AUTH_MODE:-local}
      APP_URL: ${APP_URL:-https://expbook.culater.cc}
    volumes:
      - ${DATA_DIR:-../data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://backend:4000
      APP_URL: ${APP_URL:-https://expbook.culater.cc}
      AUTH_MODE: ${AUTH_MODE:-local}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
