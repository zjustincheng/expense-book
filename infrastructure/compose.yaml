services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: expense_book
      POSTGRES_PASSWORD: expense_book
      POSTGRES_DB: expense_book
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_book"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
