apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-book-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: expense-book-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: expense-book-frontend
  template:
    metadata:
      labels:
        app: expense-book-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.frontend.port | quote }}
            - name: API_INTERNAL_URL
              value: "http://expense-book-backend:{{ .Values.backend.port }}"
            - name: APP_URL
              value: {{ .Values.app.url | quote }}
            - name: AUTH_MODE
              value: {{ .Values.app.authMode | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
