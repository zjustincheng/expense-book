apiVersion: v1
kind: Service
metadata:
  name: expense-book-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: expense-book-frontend
spec:
  type: ClusterIP
  selector:
    app: expense-book-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
